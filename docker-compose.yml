version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trainsme_postgres
    restart: always
    environment:
      POSTGRES_USER: pablo
      POSTGRES_PASSWORD: 1234asdf
      POSTGRES_DB: trainSME_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pablo -d trainSME_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: trainsme_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://pablo:1234asdf@postgres:5432/trainSME_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: trainsme_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: