version: '3'
services:
  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: pablo
      POSTGRES_PASSWORD: 1234asdf
      POSTGRES_DB: trainSME_db
    ports:
      - "5432:5432"
